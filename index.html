<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory IHC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> </link>
</head>
<body>
    <section class="screen active" id="tela-menu">
        <img class="titulo" src="assets/logo & title.svg" alt="">
        <div class="menu-botoes">
            <button id="btn-jogar">JOGAR</button>
            <button id="btn-opcoes">OPÇÕES</button>
        </div>
    </section>

    <section class="options">

    </section>

    <section class="screen" id="tela-jogo">
        <header>
            <div id="placar">
                Movimentos: <span id="movimentos">0</span> |
                Pares: <span id="pares_encontrados">0</span> / 8 |
                Tempo: <span id="tempo">00:00</span>
            </div>
        </header>
        <div class="grid-container">

            <div id="board"></div>

        </div>
    </section>
        
    <script src="script.js"></script>
</body>

</html>
